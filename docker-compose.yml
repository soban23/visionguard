services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # no "ports:" here on purpose — db is NOT exposed outside the Compose network

  web:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      MODEL_PATH: ${MODEL_PATH}
      THRESHOLD: ${THRESHOLD}
      DATABASE_URL: ${DATABASE_URL}
      FLASK_DEBUG: ${FLASK_DEBUG}
    volumes:
      - ./model:/app/model   # mount model file in rather than baking it into the image — keeps the image lean and lets you swap models without rebuilding
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
